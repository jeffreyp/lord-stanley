# Theme defaults, applied to sites that install Lord Stanley as a gem. Sites can
# override any of these. Keep site-specific values in _config.demo.yml, which
# holds the settings for this repository's demo site.

# Use slugified categories (downcased, non-alphanumeric chars replaced with
# hyphens) in post URLs instead of Jekyll's default raw categories, matching
# the slugified /category/:name/ and /tag/:name/ archive paths.
permalink: "/:slugified_categories/:year/:month/:day/:title:output_ext"

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives

sass:
  style: compressed
  sourcemap: development

# Set to `true` to show excerpts on the homepage.
show_excerpts: true

# Pagination settings
pagination:
  enabled: true
  per_page: 5
  permalink: "/page:num/"
  sort_field: "date"
  sort_reverse: true # Newest posts first

# Archive settings
jekyll-archives:
  enabled:
    - year
    - month
    - day
    - categories
    - tags
  layouts:
    year: archive
    month: archive
    day: archive
    category: archive
    tag: archive
  permalinks:
    year: "/:year/"
    month: "/:year/:month/"
    day: "/:year/:month/:day/"
    category: "/category/:name/"
    tag: "/tag/:name/"
