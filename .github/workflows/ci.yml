name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published gem advisories surface without a push.
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Audit gems for known vulnerabilities
        run: bundle exec bundler-audit check --update

      - name: Build site
        run: bundle exec jekyll build --config _config.yml,_config.demo.yml

      - name: Check HTML (broken links, images, scripts)
        run: bundle exec htmlproofer ./_site --disable-external --allow-hash-href

      - name: Check accessibility
        run: |
          python3 -m http.server 4000 --directory _site &
          npx --yes pa11y-ci@5.0.0 --config .pa11yci.json
