<li>{% assign entry = include.item %}{% assign label = entry.title | default: entry.platform %}
  <a {% unless entry.platform == 'rss' %}rel="me noopener" {% endunless %}href="{{ entry.user_url }}" target="_blank" title="{{ label }}" aria-label="{{ label }}">
    <svg class="svg-icon" aria-hidden="true">
      <use href="#{{ entry.platform }}"></use>
    </svg>
  </a>
</li>
