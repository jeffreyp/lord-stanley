{%- comment -%}
  Loads opt-in client libraries. Pass charts=true and/or mermaid=true.
  Chart.js stays parser-blocking so inline <script> charts in posts keep working;
  JSON chart blocks are rendered by the deferred charts-init.js.
{%- endcomment -%}
{%- if include.charts -%}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
        integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
        crossorigin="anonymous"></script>
<script src="{{ "/assets/js/charts-init.js" | relative_url }}" defer></script>
{%- endif -%}
{%- if include.mermaid -%}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js"
        integrity="sha384-yQ4mmBBT+vhTAwjFH0toJXNYJ6O4usWnt6EPIdWwrRvx2V/n5lXuDZQwQFeSFydF"
        crossorigin="anonymous" defer></script>
<script src="{{ "/assets/js/mermaid-init.js" | relative_url }}" defer></script>
{%- endif -%}
